<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>docloop — review view (M3)</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <strong>docloop</strong>
      <span class="muted">review view — M3 (loop)</span>
      <span class="legend">
        <span class="chip chip-ins">inserted</span>
        <span class="chip chip-del">deleted</span>
        <span class="chip chip-mark">comment anchor</span>
      </span>
      <button id="reload" class="btn" title="Pull the latest committed doc (Claude's turn)">Reload</button>
      <button
        id="save-draft"
        class="btn"
        title="Write to disk without committing — keep progress across sessions before Hand to Claude"
      >
        Save draft
      </button>
      <button id="commit" class="btn btn-primary">Hand to Claude</button>
    </header>
    <div id="sample-banner" class="sample-banner" hidden>
      ⚠ No workspace reachable — showing the bundled sample document, not your real doc. If
      you've just changed <code>vite.config.ts</code>, restart the dev server (config/plugin
      edits aren't hot-reloaded).
    </div>
    <main class="layout">
      <!-- Milkdown mounts here -->
      <section id="editor" class="doc"></section>
      <!-- Margin gutter: comment threads AND change-approval cards, each card
           absolutely positioned beside its anchor / change in the doc (see
           layoutGutter in main.ts). -->
      <aside id="sidebar" class="sidebar">
        <ol id="threads" class="threads"></ol>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
